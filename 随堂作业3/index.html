<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            width: 170px;
            height: 170px;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .cube::after{
            content: 'hover';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .cube:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.35);
        }
        .cube:hover::after{
            opacity: 1;
        }
        .c1{
            background: linear-gradient(135deg,#ff9a56,#ff6b6b);
            box-shadow: 0 10px 24px rgba(255, 107, 107, .35);
        }
        .c2{
            border-radius: 12px;
            background: linear-gradient(135deg,#4ade80,#34d399);
            box-shadow: 0 10px 24px rgba(52, 211, 153, .35);
        }
        .c3{
            border-radius: 24px;
            background: linear-gradient(135deg,#8b7aa8,#a08bb5);
            box-shadow: 0 10px 24px rgba(139, 122, 168, .35);
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#e8c56d,#d4a056);
            box-shadow: 0 10px 24px rgba(212, 160, 86, .35);
        }
        .c5{
            border-radius: 8px;
            background: linear-gradient(135deg,#5a8a7a,#4a7a6a);
            box-shadow: 0 10px 24px rgba(90, 138, 122, .35);
        }
        .c6{
            border-radius: 50%;
            background: linear-gradient(135deg,#a89bc2,#b8a8d0);
            box-shadow: 0 10px 24px rgba(168, 155, 194, .35);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
